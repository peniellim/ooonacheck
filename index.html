<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle Quality Auditor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.5; }
        .upload-area { display: flex; gap: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .error-row { background-color: #fff0f0; }
        .error-text { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Ooona Subtitle Audit Tool</h1>

    <div class="upload-area">
        <div>
            <label>1. Upload .ooona (JSON format):</label><br>
            <input type="file" id="ooonaInput" accept=".ooona">
        </div>
        <div>
            <label>2. Upload Guidelines (.txt, .docx):</label><br>
            <input type="file" id="guideInput" accept=".txt,.docx">
        </div>
    </div>

    <button onclick="runAudit()">Process and Audit</button>

    <div id="output"></div>

    <script>
        async function runAudit() {
            const ooonaFile = document.getElementById('ooonaInput').files[0];
            const guideFile = document.getElementById('guideInput').files[0];

            if (!ooonaFile || !guideFile) return alert("Please select both files.");

            // Parse .ooona JSON
            const ooonaText = await ooonaFile.text();
            const data = JSON.parse(ooonaText);
            
            // Extract Guidelines
            const guidelines = await readGuidelines(guideFile);

            // Display in Table
            displayTable(data.events || data, guidelines);
        }

        async function readGuidelines(file) {
            if (file.name.endsWith('.docx')) {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({arrayBuffer});
                return result.value;
            }
            return await file.text();
        }

        function displayTable(subtitles, rules) {
            let html = `<table><tr><th>Start</th><th>End</th><th>Subtitle Text</th><th>Audit Status</th></tr>`;
            
            subtitles.forEach(sub => {
                // ADD YOUR CUSTOM LOGIC HERE: e.g., check sub.text against rules
                const isError = sub.text.includes("bad-word"); 
                
                html += `<tr class="${isError ? 'error-row' : ''}">
                    <td>${sub.start}</td>
                    <td>${sub.end}</td>
                    <td>${sub.text}</td>
                    <td class="${isError ? 'error-text' : ''}">${isError ? 'Violation found' : 'Pass'}</td>
                </tr>`;
            });
            
            html += `</table>`;
            document.getElementById('output').innerHTML = html;
        }
    </script>
</body>
</html>
