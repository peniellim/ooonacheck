<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ooona Error Checker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { display: flex; gap: 20px; }
        .upload-section { background: white; padding: 20px; border-radius: 8px; flex: 1; }
        #results { margin-top: 20px; background: white; padding: 20px; }
        .error { background-color: #ffcccc; color: #cc0000; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<h2>Ooona Subtitle & Document Error Checker</h2>

<div class="container">
    <div class="upload-section">
        <h3>1. Upload .ooona File</h3>
        <input type="file" id="ooonaFile" accept=".ooona">
    </div>
    <div class="upload-section">
        <h3>2. Upload Source File</h3>
        <input type="file" id="sourceFile" accept=".txt,.docx,.pdf,.pptx,.hwp">
    </div>
</div>

<div id="results">
    <h3>Comparison Results</h3>
    <table id="subTable">
        <thead><tr><th>ID</th><th>Subtitle Text</th><th>Status</th></tr></thead>
        <tbody id="subBody"></tbody>
    </table>
</div>

<script>
    const ooonaInput = document.getElementById('ooonaFile');
    const sourceInput = document.getElementById('sourceFile');
    let sourceContent = "";

    // Handle Source File (Simplified text extraction)
    sourceInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => { sourceContent = e.target.result; };
        reader.readAsText(file); // Note: For PDF/DOCX, a library like mammoth.js is needed
    });

    // Handle Ooona File
    ooonaInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            parseOoona(e.target.result);
        };
        reader.readAsText(file);
    });

    function parseOoona(data) {
        const lines = data.split('\n');
        const tbody = document.getElementById('subBody');
        tbody.innerHTML = '';

        lines.forEach((line, index) => {
            if (line.trim() === "") return;
            
            const row = tbody.insertRow();
            row.insertCell(0).innerText = index + 1;
            const cellText = row.insertCell(1);
            cellText.innerText = line;
            const statusCell = row.insertCell(2);

            // Simple Logic: Check if line contains words NOT in source document
            if (sourceContent && !sourceContent.includes(line.substring(0, 5))) {
                statusCell.innerHTML = '<span class="error">Context Mismatch</span>';
                cellText.classList.add('error');
            } else {
                statusCell.innerText = 'Pass';
            }
        });
    }
</script>

</body>
</html>
