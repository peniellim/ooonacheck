<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Subtitle Validator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <style>
        :root { --primary: #000; --bg: #fff; --border: #eee; --error-bg: #fff0f0; }
        body { font-family: 'Courier New', monospace; padding: 20px; background: var(--bg); }
        .wrap { max-width: 900px; margin: auto; }
        .drop-zone { border: 2px dashed #ccc; padding: 30px; text-align: center; margin-bottom: 20px; cursor: pointer; }
        .run-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        .has-error { background: var(--error-bg); }
    </style>
</head>
<body>

<div class="wrap">
    <h2>Subtitle QC Tool</h2>
    <div style="display: flex; gap: 20px;">
        <div class="drop-zone" onclick="document.getElementById('fileSub').click()">
            <input type="file" id="fileSub" hidden accept=".ooona,.json,.xml">
            <p>Upload Subtitle (.ooona)</p>
        </div>
        <div class="drop-zone" onclick="document.getElementById('fileGuide').click()">
            <input type="file" id="fileGuide" hidden accept=".docx,.txt,.pptx,.hwpx">
            <p>Upload Guidelines (.docx, .txt, etc)</p>
        </div>
    </div>
    
    <button class="run-btn" id="runBtn">RUN QUALITY CHECK</button>

    <table id="resultsTable" style="display:none;">
        <thead><tr><th>#</th><th>Subtitle Text</th><th>Issues</th></tr></thead>
        <tbody id="tblBody"></tbody>
    </table>
</div>

<script>
    let subData = [], guideText = "";

    // 1. Handle Subtitle Upload (JSON/XML)
    document.getElementById('fileSub').onchange = async (e) => {
        const text = await e.target.files[0].text();
        // Simple heuristic: if starts with <, treat as XML, else JSON
        if (text.trim().startsWith('<')) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, "text/xml");
            // Extract text nodes (Update selector based on your XML structure)
            subData = Array.from(xml.querySelectorAll('Subtitle')).map((n, i) => ({ id: i+1, text: n.textContent }));
        } else {
            const json = JSON.parse(text);
            // Recursive helper to find subtitle arrays
            const find = (o) => {
                if (Array.isArray(o) && o[0]?.text) return o;
                for (let k in o) if (typeof o[k] === 'object') return find(o[k]);
            };
            subData = find(json) || [];
        }
        alert("Subtitles loaded: " + subData.length);
    };

    // 2. Handle Guideline Upload
    document.getElementById('fileGuide').onchange = async (e) => {
        const file = e.target.files[0];
        if (file.name.endsWith('.docx')) {
            const res = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
            guideText = res.value.toLowerCase();
        } else {
            guideText = (await file.text()).toLowerCase();
        }
        alert("Guidelines loaded.");
    };

    // 3. Run Logic
    document.getElementById('runBtn').onclick = () => {
        const tbody = document.getElementById('tblBody');
        tbody.innerHTML = "";
        document.getElementById('resultsTable').style.display = "table";

        subData.forEach((sub, i) => {
            const isError = !guideText.includes(sub.text.toLowerCase().substring(0, 10));
            const row = tbody.insertRow();
            if (isError) row.className = "has-error";
            row.insertCell(0).innerText = i + 1;
            row.insertCell(1).innerText = sub.text;
            row.insertCell(2).innerText = isError ? "⚠ Term mismatch" : "OK";
        });
    };
</script>
</body>
</html>
