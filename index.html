<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle QA Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .error { color: red; font-weight: bold; background: #fff0f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; vertical-align: top; white-space: pre-wrap; }
        .controls { background: #f4f4f4; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>OOONA Subtitle Validator</h2>
    <div class="controls">
        <label>1. Upload OOONA File (JSON): </label>
        <input type="file" id="ooonaFile"><br><br>
        <label>2. Upload Guidelines (DOCX): </label>
        <input type="file" id="guidelinesFile">
        <p><strong id="status">Status: Waiting for both files...</strong></p>
    </div>

    <table id="resultTable" style="display:none;">
        <thead><tr><th>Index</th><th>Text</th><th>Error / Status</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let guidelinesText = null;
        let lastParsedData = null;

        function checkAndProcess() {
            if (guidelinesText && lastParsedData) {
                renderTable(lastParsedData);
                document.getElementById('resultTable').style.display = 'table';
                document.getElementById('status').innerText = "Status: Guidelines applied. Showing results.";
            }
        }

        document.getElementById('guidelinesFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({arrayBuffer});
            guidelinesText = result.value.toLowerCase();
            checkAndProcess();
        });

        document.getElementById('ooonaFile').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                lastParsedData = JSON.parse(event.target.result).Paragraphs;
                checkAndProcess();
            };
            reader.readAsText(e.target.files[0]);
        });

        function renderTable(paragraphs) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            paragraphs.forEach(para => {
                const text = para.Lines.map(l => l.Text.replace(/<[^>]*>/g, '')).join('\n');
                const qcError = para.QcErrorCode || "";
                
                let manualError = "";
                if (guidelinesText.includes("no periods") && text.includes(".")) manualError = "Violation: Period found.";
                if (guidelinesText.includes("max chars") && text.length > 50) manualError = "Violation: Too many characters.";

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${para.Index}</td>
                    <td>${text}</td>
                    <td class="${qcError || manualError ? 'error' : ''}">
                        ${qcError ? 'QC: ' + qcError : ''}
                        ${qcError && manualError ? '<br>' : ''}
                        ${manualError ? 'Guideline: ' + manualError : ''}
                        ${!qcError && !manualError ? 'Clean' : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
