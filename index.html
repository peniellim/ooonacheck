<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle Quality Auditor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .upload-box { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
        pre { background: #eee; padding: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>Ooona Subtitle Audit Tool</h1>

    <div class="upload-box">
        <label><strong>1. Upload .ooona (JSON):</strong></label><br>
        <input type="file" id="ooonaFile" accept=".ooona,.json"><br><br>
        <label><strong>2. Upload Guidelines (.docx, .pdf, .txt):</strong></label><br>
        <input type="file" id="guideFile" accept=".docx,.pdf,.txt">
    </div>

    <button onclick="processFiles()" style="padding: 10px 20px;">Parse and Audit</button>

    <div id="resultArea"></div>

    <script>
        async function processFiles() {
            const ooonaFile = document.getElementById('ooonaFile').files[0];
            const guideFile = document.getElementById('guideFile').files[0];
            const resultArea = document.getElementById('resultArea');

            if (!ooonaFile || !guideFile) return alert("Please upload both files.");

            try {
                const ooonaText = await ooonaFile.text();
                const data = JSON.parse(ooonaText);
                
                // 1. Find array
                let subtitles = Array.isArray(data) ? data : Object.values(data).find(Array.isArray);
                if (!subtitles) throw new Error("Could not find subtitle array.");

                // 2. Identify text key by looking at the first item
                const sample = subtitles[0];
                const textKey = Object.keys(sample).find(k => 
                    ['text', 'content', 'c', 't', 'sub'].includes(k.toLowerCase())
                ) || Object.keys(sample)[2]; // Fallback to 3rd column if name is unknown

                console.log("Detected keys:", Object.keys(sample));
                console.log("Using text key:", textKey);

                const guidelinesText = await extractText(guideFile);
                renderTable(subtitles, textKey, guidelinesText);

            } catch (err) {
                resultArea.innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
            }
        }

        async function extractText(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'docx') {
                const result = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
                return result.value;
            } 
            if (ext === 'pdf') {
                const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
                let text = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(" ");
                }
                return text;
            }
            return await file.text();
        }

        function renderTable(subs, textKey, rules) {
            let html = `<table><tr><th>Start</th><th>End</th><th>Text (via key: ${textKey})</th><th>Status</th></tr>`;
            subs.forEach(s => {
                const content = s[textKey] || "EMPTY";
                html += `<tr><td>${s.start || ""}</td><td>${s.end || ""}</td><td>${content}</td><td>OK</td></tr>`;
            });
            html += `</table>`;
            document.getElementById('resultArea').innerHTML = html;
        }
    </script>
</body>
</html>
