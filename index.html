<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle Quality Auditor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; line-height: 1.6; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .error { background-color: #ffcccc; color: #d8000c; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Subtitle Audit Tool</h1>

    <div class="grid-container">
        <div>
            <label>1. Upload .ooona (JSON):</label>
            <input type="file" id="jsonInput" accept=".json">
        </div>
        <div>
            <label>2. Upload Guidelines (docx, pdf, txt):</label>
            <input type="file" id="guideInput">
        </div>
    </div>

    <button onclick="processAudit()" style="margin-top: 20px; padding: 10px 20px;">Run Audit</button>

    <div id="resultArea"></div>

    <script>
        async function processAudit() {
            const jsonFile = document.getElementById('jsonInput').files[0];
            const guideFile = document.getElementById('guideInput').files[0];

            if (!jsonFile || !guideFile) return alert("Please upload both files.");

            // 1. Load JSON Subtitles
            const jsonText = await jsonFile.text();
            const subtitles = JSON.parse(jsonText); 
            
            // 2. Load Guidelines (Simplified text extraction)
            let guidelines = await extractTextFromDoc(guideFile);

            // 3. Render Table
            renderSubtitleTable(subtitles, guidelines);
        }

        async function extractTextFromDoc(file) {
            // This function acts as a router for different file types
            if (file.name.endsWith('.txt')) return await file.text();
            if (file.name.endsWith('.docx')) {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({arrayBuffer});
                return result.value;
            }
            return "Guidelines loaded (Binary format detected).";
        }

        function renderSubtitleTable(data, guidelines) {
            let html = `<table><tr><th>Start</th><th>End</th><th>Text</th><th>Status</th></tr>`;
            data.forEach(sub => {
                // Example Logic: Simple check if sub exceeds a hypothetical length constraint
                const hasError = sub.text.length > 40; 
                html += `<tr>
                    <td>${sub.start}</td>
                    <td>${sub.end}</td>
                    <td>${sub.text}</td>
                    <td class="${hasError ? 'error' : ''}">${hasError ? 'Length Warning' : 'OK'}</td>
                </tr>`;
            });
            html += `</table>`;
            document.getElementById('resultArea').innerHTML = html;
        }
    </script>
</body>
</html>
