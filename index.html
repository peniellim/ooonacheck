<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Ooona Validator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background: #f9f9f9; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .controls { display: flex; gap: 20px; align-items: center; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .error-row { background-color: #fff0f0; }
        .error-text { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<h2>Subtitle Validation Suite</h2>

<div class="panel">
    <div class="controls">
        <div>
            <label><strong>1. Subtitle File (.ooona):</strong></label><br>
            <input type="file" id="ooonaFile" accept=".ooona">
        </div>
        <div>
            <label><strong>2. Guidelines Document:</strong></label><br>
            <input type="file" id="docFile" accept=".docx,.pdf,.txt">
        </div>
        <button id="runBtn">Run Quality Checks</button>
    </div>
</div>

<table id="resultTable" style="display:none;">
    <thead><tr><th>ID</th><th>Content</th><th>Status</th></tr></thead>
    <tbody id="subBody"></tbody>
</table>

<script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    let rawOoonaData = "";
    let guidelineText = "";

    // Load Files into Memory
    document.getElementById('ooonaFile').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (e) => rawOoonaData = e.target.result;
        reader.readAsText(e.target.files[0]);
    };

    document.getElementById('docFile').onchange = async (e) => {
        const file = e.target.files[0];
        if (file.name.endsWith('.docx')) {
            const result = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
            guidelineText = result.value.toLowerCase();
        } else if (file.name.endsWith('.pdf')) {
            const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
            let text = "";
            for(let i=1; i<=pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(item => item.str).join(" ");
            }
            guidelineText = text.toLowerCase();
        } else {
            guidelineText = (await file.text()).toLowerCase();
        }
        console.log("Guidelines Loaded.");
    };

    // Run Checks
    document.getElementById('runBtn').onclick = () => {
        if (!rawOoonaData || !guidelineText) return alert("Please upload both files.");
        
        const lines = rawOoonaData.split(/\r?\n/);
        const tbody = document.getElementById('subBody');
        tbody.innerHTML = "";
        document.getElementById('resultTable').style.display = "table";

        lines.forEach((line, index) => {
            if (line.trim().length < 3) return;
            
            const isError = !guidelineText.includes(line.toLowerCase().substring(0, 10));
            const row = tbody.insertRow();
            if (isError) row.className = "error-row";
            
            row.insertCell(0).innerText = index + 1;
            row.insertCell(1).innerText = line;
            row.insertCell(2).innerHTML = isError 
                ? '<span class="error-text">⚠ Check Guidelines</span>' 
                : 'Pass';
        });
    };
</script>

</body>
</html>
