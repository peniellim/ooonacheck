<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle QA Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .error { color: red; font-weight: bold; background: #fff0f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .controls { background: #f4f4f4; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>OOONA Subtitle Validator</h2>
    <div class="controls">
        <label>1. Upload OOONA File (JSON): </label>
        <input type="file" id="ooonaFile"><br><br>
        <label>2. Upload Guidelines (DOCX): </label>
        <input type="file" id="guidelinesFile">
    </div>

    <table id="outputTable">
        <thead>
            <tr><th>Index</th><th>Text</th><th>Error / Status</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let guidelinesText = "";

        document.getElementById('guidelinesFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({arrayBuffer});
            guidelinesText = result.value.toLowerCase();
            alert("Guidelines loaded!");
        });

        document.getElementById('ooonaFile').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const data = JSON.parse(event.target.result);
                renderTable(data.Paragraphs);
            };
            reader.readAsText(e.target.files[0]);
        });

        function renderTable(paragraphs) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            paragraphs.forEach(para => {
                const text = para.Lines.map(l => l.Text.replace(/<[^>]*>/g, '')).join(' | ');
                const error = para.QcErrorCode || "";
                
                // Simple logic: check if guidelines contain common keywords to flag
                let manualError = "";
                if (guidelinesText.includes("no periods") && text.includes(".")) manualError = "Period detected (Violation)";

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${para.Index}</td>
                    <td>${text}</td>
                    <td class="${error || manualError ? 'error' : ''}">${error || manualError || "Clean"}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
