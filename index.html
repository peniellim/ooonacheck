<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle Quality Auditor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.5; }
        .upload-box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
        .error { color: #d8000c; background-color: #ffbaba; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Ooona Subtitle Audit Tool</h1>

    <div class="upload-box">
        <label>1. Upload .ooona (JSON format):</label>
        <input type="file" id="ooonaFile" accept=".ooona,.json"><br><br>
        
        <label>2. Upload Guidelines (.docx, .pdf, .txt):</label>
        <input type="file" id="guideFile" accept=".docx,.pdf,.txt">
    </div>

    <button onclick="processFiles()">Parse and Audit</button>

    <div id="resultArea"></div>

    <script>
        async function processFiles() {
            const ooonaFile = document.getElementById('ooonaFile').files[0];
            const guideFile = document.getElementById('guideFile').files[0];

            if (!ooonaFile || !guideFile) return alert("Please upload both files.");

            // 1. Process .ooona JSON
            const jsonText = await ooonaFile.text();
            const data = JSON.parse(jsonText);
            const subtitles = data.events || data;

            // 2. Process Guidelines based on file extension
            let guidelinesText = await extractText(guideFile);
            
            // 3. Render Output
            renderTable(subtitles, guidelinesText);
        }

        async function extractText(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (ext === 'docx') {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({arrayBuffer});
                return result.value;
            } 
            
            if (ext === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                let text = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(" ");
                }
                return text;
            }

            return await file.text(); // Default for .txt
        }

        function renderTable(subs, rules) {
            let html = `<table><tr><th>Start</th><th>End</th><th>Text</th><th>Status</th></tr>`;
            subs.forEach(s => {
                // Placeholder: Add your specific logic to compare 's.text' against 'rules'
                const hasError = false; 
                html += `<tr><td>${s.start}</td><td>${s.end}</td><td>${s.text}</td>
                         <td class="${hasError ? 'error' : ''}">${hasError ? 'Violation' : 'Pass'}</td></tr>`;
            });
            html += `</table>`;
            document.getElementById('resultArea').innerHTML = html;
        }
    </script>
</body>
</html>
