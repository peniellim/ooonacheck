<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle Quality Auditor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Fix for PDF Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.5; }
        .upload-box { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
        .error { color: #d8000c; background-color: #ffbaba; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Ooona Subtitle Audit Tool</h1>

    <div class="upload-box">
        <label><strong>1. Upload .ooona (JSON format):</strong></label><br>
        <input type="file" id="ooonaFile" accept=".ooona,.json"><br><br>
        
        <label><strong>2. Upload Guidelines (.docx, .pdf, .txt):</strong></label><br>
        <input type="file" id="guideFile" accept=".docx,.pdf,.txt">
    </div>

    <button onclick="processFiles()" style="padding: 10px 20px;">Parse and Audit</button>

    <div id="resultArea"></div>

    <script>
        async function processFiles() {
            const ooonaFile = document.getElementById('ooonaFile').files[0];
            const guideFile = document.getElementById('guideFile').files[0];
            const resultArea = document.getElementById('resultArea');

            if (!ooonaFile || !guideFile) return alert("Please upload both files.");

            try {
                // 1. Process .ooona JSON
                const ooonaText = await ooonaFile.text();
                const data = JSON.parse(ooonaText);
                
                // Auto-detect array
                let subtitles = Array.isArray(data) ? data : null;
                if (!subtitles) {
                    for (let key in data) {
                        if (Array.isArray(data[key])) {
                            subtitles = data[key];
                            break;
                        }
                    }
                }

                if (!subtitles) throw new Error("Could not find subtitle array in JSON.");

                // 2. Process Guidelines
                const guidelinesText = await extractText(guideFile);
                
                // 3. Render
                renderTable(subtitles, guidelinesText);

            } catch (err) {
                resultArea.innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
            }
        }

        async function extractText(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'docx') {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({arrayBuffer});
                return result.value;
            } 
            if (ext === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                let text = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(" ");
                }
                return text;
            }
            return await file.text();
        }

        function renderTable(subs, rules) {
            let html = `<table><tr><th>Start</th><th>End</th><th>Text</th><th>Status</th></tr>`;
            subs.forEach(s => {
                // Accessing text. Adjust properties if your JSON uses different keys (e.g. s.content)
                const text = s.text || s.content || "";
                const hasError = false; 
                html += `<tr>
                    <td>${s.start || ""}</td>
                    <td>${s.end || ""}</td>
                    <td>${text}</td>
                    <td class="${hasError ? 'error' : ''}">${hasError ? 'Violation' : 'OK'}</td>
                </tr>`;
            });
            html += `</table>`;
            document.getElementById('resultArea').innerHTML = html;
        }
    </script>
</body>
</html>
