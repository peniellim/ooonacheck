<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle Quality Auditor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>

    <h1>Ooona Subtitle Audit Tool</h1>
    <div class="box">
        <label>1. Upload .ooona file:</label><br>
        <input type="file" id="ooonaFile"><br><br>
        <label>2. Upload Guidelines (.docx, .pdf, .txt):</label><br>
        <input type="file" id="guideFile">
    </div>
    <button onclick="processFiles()">Parse and Audit</button>
    <div id="resultArea"></div>

    <script>
        async function processFiles() {
            const file = document.getElementById('ooonaFile').files[0];
            const resultArea = document.getElementById('resultArea');
            if (!file) return alert("Upload an Ooona file");

            const text = await file.text();
            const data = JSON.parse(text);

            // LOGIC: Find the array that is NOT "Warnings"
            let subs = null;
            let keyName = "";

            for (let k in data) {
                if (Array.isArray(data[k]) && k !== "Warnings" && data[k].length > 0) {
                    subs = data[k];
                    keyName = k;
                    break;
                }
            }

            if (!subs) {
                resultArea.innerHTML = "<h3>Error: Could not find subtitle data.</h3><p>Keys found: " + Object.keys(data).join(', ') + "</p>";
                return;
            }

            let html = `<h3>Detected Subtitles in key: "${keyName}"</h3>`;
            html += `<table><tr><th>Start</th><th>End</th><th>Text</th><th>Status</th></tr>`;
            
            subs.forEach(s => {
                // Mapping typical Ooona keys
                const start = s.start || s.startTime || s.start_time || "";
                const end = s.end || s.endTime || s.end_time || "";
                const content = s.text || s.content || s.translation || "";
                
                html += `<tr><td>${start}</td><td>${end}</td><td>${content}</td><td>Pending</td></tr>`;
            });
            
            html += `</table>`;
            resultArea.innerHTML = html;
        }
    </script>
</body>
</html>
