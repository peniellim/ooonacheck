<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON Subtitle Checker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .container { border: 1px solid #ccc; padding: 1.5rem; border-radius: 8px; }
        .upload-section { margin-bottom: 1.5rem; }
        #results { margin-top: 1rem; background: #f9f9f9; padding: 1rem; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ooona JSON Validator</h1>
    
    <div class="upload-section">
        <label>1. Upload .ooona (JSON) file:</label>
        <input type="file" id="jsonFile" accept=".ooona,.json">
    </div>

    <div class="upload-section">
        <label>2. Upload Guidelines (.txt or .docx):</label>
        <input type="file" id="guideFile" accept=".txt,.docx">
    </div>

    <button onclick="analyzeFiles()">Analyze Subtitles</button>

    <div id="results">Upload files to begin analysis.</div>
</div>

<script>
    async function analyzeFiles() {
        const jsonInput = document.getElementById('jsonFile').files[0];
        const guideInput = document.getElementById('guideFile').files[0];
        const resultsDiv = document.getElementById('results');

        if (!jsonInput || !guideInput) {
            alert("Please upload both files.");
            return;
        }

        try {
            // 1. Process JSON
            const jsonText = await jsonInput.text();
            const subtitleData = JSON.parse(jsonText);
            
            // Adjust 'subtitleArray' based on your actual JSON structure
            // Example assuming a structure like { "subtitles": [...] }
            const subtitles = subtitleData.subtitles || subtitleData; 

            // 2. Process Guidelines
            let guideText = "";
            if (guideInput.name.endsWith('.docx')) {
                const arrayBuffer = await guideInput.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                guideText = result.value;
            } else {
                guideText = await guideInput.text();
            }

            // 3. Display Results
            let output = "<h3>Subtitle List:</h3><ul>";
            subtitles.forEach((s, index) => {
                output += `<li><strong>${index + 1}:</strong> ${s.text || s.content || "N/A"}</li>`;
            });
            output += "</ul>";
            
            resultsDiv.innerHTML = output;
            console.log("Guidelines loaded for comparison:", guideText);
            
        } catch (err) {
            resultsDiv.innerText = "Error: " + err.message;
        }
    }
</script>

</body>
</html>
