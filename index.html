<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle Validator</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .container { border: 1px solid #ccc; padding: 1.5rem; border-radius: 8px; }
        .upload-section { margin-bottom: 1.5rem; }
        #results { margin-top: 1rem; white-space: pre-wrap; background: #f4f4f4; padding: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Subtitle Quality Checker</h1>
    
    <div class="upload-section">
        <label>1. Upload Ooona (.subs) file:</label>
        <input type="file" id="subsFile" accept=".subs,.txt">
    </div>

    <div class="upload-section">
        <label>2. Upload Guidelines (.txt, .docx, .pdf):</label>
        <input type="file" id="guidelinesFile" accept=".txt,.docx,.pdf">
    </div>

    <button onclick="processFiles()">Analyze Subtitles</button>

    <div id="results"></div>
</div>

<script>
    async function processFiles() {
        const subsInput = document.getElementById('subsFile').files[0];
        const guideInput = document.getElementById('guidelinesFile').files[0];
        const resultsDiv = document.getElementById('results');

        if (!subsInput || !guideInput) {
            alert("Please upload both files.");
            return;
        }

        // Logic for reading text files
        const readerSubs = new FileReader();
        const readerGuide = new FileReader();

        readerSubs.onload = (e) => {
            const subsContent = e.target.result;
            // Parse Ooona: Split by newline or standard tab-delimited format
            const lines = subsContent.split('\n');
            resultsDiv.innerText = "Parsed Subtitle Cells:\n" + lines.join('\n');
        };

        readerSubs.readAsText(subsInput);
        // Note: For .docx or .pdf, you would implement a library parser here
        readerGuide.readAsText(guideInput);
    }
</script>

</body>
</html>
