<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Ooona Validator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .panel { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .error-row { background-color: #fff0f0; }
        .error-badge { color: red; font-weight: bold; font-size: 0.8em; }
    </style>
</head>
<body>

<h2>Local Subtitle Validator (No API)</h2>

<div class="panel">
    <input type="file" id="ooonaFile" accept=".json,.ooona">
    <input type="file" id="docFile" accept=".docx,.txt">
    <button id="runBtn">Run Local Check</button>
</div>

<table id="resultTable" style="display:none;">
    <thead><tr><th>ID</th><th>Text</th><th>Result</th></tr></thead>
    <tbody id="subBody"></tbody>
</table>

<script>
    let subtitles = [];
    let guideText = "";

    // 1. Load Ooona File
    document.getElementById('ooonaFile').onchange = async (e) => {
        const text = await e.target.files[0].text();
        const data = JSON.parse(text);
        // Recursively find the array containing objects with a 'text' property
        const findSubs = (obj) => {
            if (Array.isArray(obj) && obj[0]?.text) return obj;
            for (let key in obj) {
                if (typeof obj[key] === 'object') {
                    const found = findSubs(obj[key]);
                    if (found) return found;
                }
            }
        };
        subtitles = findSubs(data) || [];
    };

    // 2. Load Guidelines
    document.getElementById('docFile').onchange = async (e) => {
        const file = e.target.files[0];
        if (file.name.endsWith('.docx')) {
            const res = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
            guideText = res.value.toLowerCase();
        } else {
            guideText = (await file.text()).toLowerCase();
        }
    };

    // 3. Local Error Logic
    document.getElementById('runBtn').onclick = () => {
        const tbody = document.getElementById('subBody');
        tbody.innerHTML = "";
        document.getElementById('resultTable').style.display = "table";

        subtitles.forEach((sub, index) => {
            let errors = [];
            
            // Example Local Rule: Max 42 characters
            if (sub.text.length > 42) errors.push("Too long (>42 chars)");
            
            // Example Local Rule: Check if line exists in guidelines
            if (!guideText.includes(sub.text.toLowerCase().substring(0, 10))) {
                errors.push("Missing context in guidelines");
            }

            const row = tbody.insertRow();
            if (errors.length > 0) row.className = "error-row";
            
            row.insertCell(0).innerText = index + 1;
            row.insertCell(1).innerText = sub.text;
            row.insertCell(2).innerHTML = errors.length > 0 
                ? `<span class="error-badge">${errors.join(', ')}</span>` 
                : "Pass";
        });
    };
</script>

</body>
</html>
