<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle Debugger</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .debug-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 10px; margin-bottom: 20px; }
        pre { background: #f8f9fa; padding: 10px; border: 1px solid #dee2e6; overflow: auto; }
    </style>
</head>
<body>
    <h1>Ooona Structure Debugger</h1>
    <input type="file" id="ooonaFile" accept=".ooona,.json">
    <button onclick="debugFile()">Inspect File Structure</button>
    <div id="debugArea"></div>

    <script>
        async function debugFile() {
            const file = document.getElementById('ooonaFile').files[0];
            if (!file) return alert("Select a file");
            
            const text = await file.text();
            const data = JSON.parse(text);
            const debugArea = document.getElementById('debugArea');

            let output = `<h3>File Keys Detected:</h3><p>${Object.keys(data).join(', ')}</p>`;
            output += `<h3>Raw Preview (First 500 chars):</h3><pre>${text.substring(0, 500)}</pre>`;
            
            debugArea.innerHTML = output;
        }
    </script>
</body>
</html>
